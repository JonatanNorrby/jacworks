name: Verify game
on:
  pull_request:
  push:
    branches: [main]
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/release-012.spec.ts tests/release-013-duo-meter.spec.ts tests/release-014-talents.spec.ts tests/release-015-lobby-talents.spec.ts tests/release-016-talents-gear.spec.ts tests/release-017-keybindings.spec.ts tests/release-018-combat-ui.spec.ts tests/release-019-ant-queen.spec.ts tests/release-020-bigger-nest.spec.ts tests/release-021-classes-chaos-guide.spec.ts tests/dps-party-hub.spec.ts tests/chat.spec.ts --timeout 180000
